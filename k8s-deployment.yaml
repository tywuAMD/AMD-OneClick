# AMD OneClick Notebook Manager - Kubernetes Deployment
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amd-oneclick-manager
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amd-oneclick-manager
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amd-oneclick-manager
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amd-oneclick-manager
subjects:
  - kind: ServiceAccount
    name: amd-oneclick-manager
    namespace: default

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-oneclick-config
  namespace: default
data:
  K8S_NAMESPACE: "default"
  DEFAULT_IMAGE: "docker.io/rocm/vllm:rocm7.12.0_gfx110X-all_ubuntu24.04_py3.12_pytorch_2.9.1_vllm_0.16.0"
  CPU_LIMIT: "128"
  MEMORY_LIMIT: "128Gi"
  GPU_LIMIT: "8"
  CPU_REQUEST: "40"
  MEMORY_REQUEST: "48Gi"
  IDLE_TIMEOUT_MINUTES: "10"
  MAX_LIFETIME_HOURS: "6"
  SERVICE_HOST: "36.150.116.245"
  NODE_PORT_BASE: "30000"
  NOTEBOOK_TOKEN: "amd-oneclick"
  NOTEBOOK_NODE_HOSTNAME: "wx-ms-w7900d-0027"
  PUBLIC_MODELS_HOST_PATH: "/models"
  PUBLIC_MODELS_MOUNT_PATH: "/models"
  RESERVATION_API_BASE_URL: "http://36.150.116.245:4100/api"
  ALLOW_PUBLIC_NOTEBOOK_API: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: amd-oneclick-secrets
  namespace: default
type: Opaque
stringData:
  ADMIN_PASSWORD: "admin123"
  NOTEBOOK_BRIDGE_SHARED_TOKEN: "9ca9c7fa3500226449f2962a5dc19e877cbb8ebb9b386918a10f3a31d649e8c9"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-oneclick-manager
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd-oneclick-manager
  template:
    metadata:
      labels:
        app: amd-oneclick-manager
    spec:
      serviceAccountName: amd-oneclick-manager
      containers:
        - name: manager
          image: tyamd/cie2026:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: amd-oneclick-config
            - secretRef:
                name: amd-oneclick-secrets
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: amd-oneclick-manager
  namespace: default
spec:
  selector:
    app: amd-oneclick-manager
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30081
